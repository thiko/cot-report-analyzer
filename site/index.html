<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COT Report Analyser</title>
<meta name="description" content="Weekly CFTC Commitments of Traders positioning across the disaggregated, legacy, financial and supplemental reports.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📊</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="masthead">
  <div class="masthead__bar">
    <h1 class="masthead__title">COT Report Analyser</h1>
    <span class="masthead__meta" id="build-meta"></span>
    <span class="masthead__spacer"></span>
    <label class="visually-hidden" for="language-select" data-i18n="app.languageAria">Interface language</label>
    <select class="btn btn--select" id="language-select" data-i18n-aria="app.languageAria"></select>
    <button class="btn" id="theme-toggle" type="button"
            data-i18n="app.theme" data-i18n-aria="app.themeAria">Theme</button>
  </div>
  <nav class="tabs" id="report-tabs" role="tablist" aria-label="COT report type"></nav>
</header>

<main class="shell">
  <p class="intro" id="report-description"></p>

  <section class="toolbar" aria-label="Filters">
    <div class="field">
      <label class="field__label" for="date-select" data-i18n="toolbar.reportDate">Report date</label>
      <select id="date-select"></select>
    </div>
    <div class="field">
      <label class="field__label" for="compare-select" data-i18n="toolbar.compareWith">Compare with</label>
      <select id="compare-select"></select>
    </div>
    <div class="field">
      <label class="field__label" for="category-select" data-i18n="toolbar.category">Category</label>
      <select id="category-select"></select>
    </div>
    <div class="field">
      <label class="field__label" for="search-input" data-i18n="toolbar.search">Search</label>
      <input type="search" id="search-input" placeholder="Corn, GC, …" autocomplete="off"
             data-i18n-placeholder="toolbar.searchPlaceholder">
    </div>
    <div class="field">
      <span class="field__label" id="groups-label" data-i18n="toolbar.traderGroups">Trader groups</span>
      <div class="chips" id="group-chips" role="group" aria-labelledby="groups-label"></div>
    </div>
    <div class="field">
      <span class="field__label" id="measure-label" data-i18n="toolbar.netShownAs">Net shown as</span>
      <div class="chips" id="measure-chips" role="group" aria-labelledby="measure-label">
        <button class="chip" type="button" data-measure="net" aria-pressed="true"
                data-i18n="toolbar.contracts">Contracts</button>
        <button class="chip" type="button" data-measure="pct_oi" aria-pressed="false"
                data-i18n="toolbar.pctOi">% of OI</button>
      </div>
    </div>
  </section>

  <section class="shortlist" id="shortlist" data-open="true" aria-labelledby="shortlist-title">
    <div class="shortlist__head">
      <button class="shortlist__toggle" id="shortlist-toggle" type="button"
              aria-expanded="true" aria-controls="shortlist-body">
        <span class="shortlist__caret" aria-hidden="true"></span>
        <h2 class="shortlist__title" id="shortlist-title" data-i18n="shortlist.title">Worth a closer look</h2>
      </button>
      <span class="shortlist__count" id="shortlist-count"></span>
      <span class="shortlist__blurb" data-i18n="shortlist.blurb"></span>
    </div>
    <div class="shortlist__body" id="shortlist-body"></div>
    <p class="shortlist__note" id="shortlist-note"></p>
  </section>

  <div class="table-wrap">
    <table class="cot" id="cot-table">
      <caption class="visually-hidden" data-i18n="table.caption">Net positioning by market and trader group</caption>
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <p class="status" id="status" hidden></p>

  <section class="notes">
    <div class="panel">
      <h2 class="panel__title" data-i18n="notes.readingTitle"></h2>
      <ul>
        <li data-i18n-html="notes.reading1"></li>
        <li data-i18n-html="notes.reading2"></li>
        <li data-i18n-html="notes.reading3"></li>
        <li data-i18n-html="notes.reading4"></li>
        <li data-i18n-html="notes.reading5"></li>
      </ul>
    </div>
    <div class="panel">
      <h2 class="panel__title" data-i18n="notes.flagsTitle"></h2>
      <ul>
        <li data-i18n-html="notes.flags1"></li>
        <li data-i18n-html="notes.flags2"></li>
        <li data-i18n-html="notes.flags3"></li>
        <li data-i18n-html="notes.flags4"></li>
      </ul>
    </div>
    <div class="panel">
      <h2 class="panel__title" data-i18n="notes.whoTitle"></h2>
      <ul id="group-glossary"></ul>
    </div>
    <div class="panel">
      <h2 class="panel__title" data-i18n="notes.sourceTitle"></h2>
      <ul>
        <li data-i18n="notes.source1"></li>
        <li data-i18n="notes.source2"></li>
        <li id="term-structure-note"></li>
      </ul>
    </div>
  </section>
</main>

<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>
<script src="app.js" type="module"></script>
</body>
</html>
