[app]
# Downloaded CFTC archives and the working SQLite database. Not committed —
# the workflow restores it from the Actions cache and rebuilds it if missing.
cache_directory = outputs/tmp
database_filename = cot.db

# Generated JSON consumed by the static site. Committed, this is the history.
data_directory = data

# Years of CFTC data to keep loaded. The longest percentile window is 3 years,
# so anything below 4 leaves the 156w column incomplete.
history_years = 5

log_level = INFO
