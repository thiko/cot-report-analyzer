name: COT report

on:
  schedule:
    # The CFTC publishes Fridays at 15:30 ET. That is 19:30 UTC in summer and
    # 20:30 UTC in winter, so run at 22:00 UTC to be clear of both.
    - cron: '0 22 * * 5'
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: cot-report
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      # The CFTC archives are ~15 MB per report type and year. Caching them
      # keeps a weekly run to the current year's five downloads; on a cache
      # miss the pipeline simply refetches everything.
      - name: Restore CFTC archive cache
        uses: actions/cache@v4
        with:
          path: outputs/tmp
          key: cftc-archives-${{ github.run_id }}
          restore-keys: cftc-archives-

      # Prices run here now. The feed that answered GitHub's shared address
      # ranges with a standing 429 is gone; FRED needs no key and no quota, and
      # the Alpha Vantage half degrades to skipped rather than failing the run
      # when the key is absent or the daily allowance is spent.
      - name: Build report data
        run: python main.py --prices
        env:
          # Repository secret, never a literal here: workflow files are public
          # in a public repo. Absent, the price feed is skipped rather than
          # failing the run, the same way it behaves with no network.
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

      # data/ is generated output, not a contribution to be merged: whatever
      # this run produced is the answer, and there is no second version of it
      # to reconcile. Rebasing said otherwise, and rebasing a commit that
      # rewrites minified single-line JSON onto one that did the same conflicts
      # every time — the files are one line each, so any difference is a
      # whole-line collision git cannot resolve. A re-run hit this reliably:
      # actions/checkout starts a re-run from the original trigger's SHA, so
      # origin has usually moved on. Rebuilding the commit on the current tip
      # instead cannot conflict, and a rejected push just tries again.
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            git add -A data
            if git diff --cached --quiet; then
              echo "No data changes."
              exit 0
            fi
            git commit -m "data: COT report through $(python -c "import json;print(json.load(open('data/index.json'))['latest_date'])")"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebuilding on the new tip."
          done
          echo "Could not push after 3 attempts."
          exit 1

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
